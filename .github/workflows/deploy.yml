name: Deploy personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint && npm run typecheck

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Upload site
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=3600" \
            --only-show-errors
          aws s3 sync dist/assets/ "s3://${{ vars.AWS_S3_BUCKET }}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
          aws s3 cp dist/index.html "s3://${{ vars.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-github-pages-redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

      - name: Deploy redirect site
        id: deployment
        uses: actions/deploy-pages@v5
